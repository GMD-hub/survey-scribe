# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: survey-scribe
services:
  ai-project:
    host: azure.ai.project
  survey-scribe-hosted-container:
    project: src/survey-scribe
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    container:
      resources:
        cpu: "2.0"
        memory: 4.0Gi
    description: Survey-scribe agent using the Responses protocol with a
      bring-your-own approach. Calls a Foundry model via the Responses API and
      returns the response.
    displayName: Survey Scribe v2
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: gpt-5-mini
    kind: hosted
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Bring Your Own
        - Python
    name: survey-scribe-v2
    protocols:
      - protocol: responses
        version: 2.0.0
    docker:
      path: Dockerfile
infra:
  provider: microsoft.foundry
