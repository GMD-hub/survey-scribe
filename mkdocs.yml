site_name: Survey Scribe
site_description: Typed survey questionnaire metadata, safe local source normalization, and SVIS artifacts
site_url: https://gmd-hub.github.io/survey-scribe/
copyright: Copyright 2026 Survey Scribe contributors
strict: true
docs_dir: docs
site_dir: site

exclude_docs: |
  api.md
  dependencies.md
  examples.md
  /installation.md
  legal-disposition.md
  pipeline_overview.md
  project-log.md
  release-readiness.md
  svis_field_guide.md
  usage.md

theme:
  name: material
  language: en
  font: false
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
  palette:
    scheme: default
    primary: indigo
    accent: cyan

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            members_order: source
            filters:
              - "!^_"
            heading_level: 2
            merge_init_into_class: true
            separate_signature: true
            show_bases: true
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/playground.js

extra:
  analytics:
    feedback: false
  version:
    provider: false
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Extract Your First Questionnaire: getting-started/quickstart.md
      - Command Line: cli.md
  - Questionnaire Extraction:
      - Extraction Guide: guides/extraction.md
      - Completed Questionnaires: guides/completed-questionnaires.md
      - Questionnaire Sources: guides/sources.md
      - XLSForm: sources/xlsform.md
      - Skip Patterns: guides/skip-patterns.md
      - Routing Model: routing.md
      - Results and Artifacts: guides/results.md
      - SVIS Field Guide: guides/svis.md
  - AI and Deployment:
      - Palantir Foundry: platforms/palantir-foundry.md
      - Microsoft Foundry: platforms/microsoft-foundry.md
      - mAI Factory: integrations/mai-factory.md
      - AI Providers: guides/ai-providers.md
      - Configuration: guides/configuration.md
      - Security and API Keys: guides/security.md
      - Privacy and Local-First Boundaries: guides/privacy.md
  - Advanced Guides:
      - Custom Structured Output: guides/custom-models.md
      - Evaluation Policy: evaluation.md
      - Use Cases: guides/use-cases.md
      - Static Sample Explorer: playground.md
  - API Reference:
      - API Overview: reference/index.md
      - Extraction Client and Pipelines: reference/client.md
      - SVIS Models: reference/models.md
      - Configuration: reference/configuration.md
      - Results: reference/results.md
      - Sources: reference/sources.md
      - Serialization: reference/serialization.md
      - Routing: reference/routing.md
      - Providers: reference/providers.md
      - Exceptions: reference/exceptions.md
      - Command Line: reference/cli.md
      - JSON Schemas: reference/schemas.md
  - Project:
      - Features and Limitations: project/features.md
      - Compatibility: compatibility.md
      - Migration: migration.md
      - Documentation Site: contributing/documentation.md
