site_name: Survey Scribe
site_description: Typed Survey Variable Information Schema models and extraction tooling
site_url: https://gmd-hub.github.io/survey-scribe/
repo_url: https://github.com/GMD-hub/survey-scribe
repo_name: GMD-hub/survey-scribe
edit_uri: edit/main/docs/
copyright: Copyright 2026 Survey Scribe contributors

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    primary: blue
    accent: light blue

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Examples: examples.md
  - API Reference: api.md
  - SVIS Field Guide: svis_field_guide.md
  - Compatibility: compatibility.md
  - Dependencies: dependencies.md
  - Release Readiness: release-readiness.md
  - Project Notes:
      - Pipeline Overview: pipeline_overview.md
      - Evaluation: evaluation.md
      - Legal Disposition: legal-disposition.md
      - Project Log: project-log.md
