name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.11"
          enable-cache: true
      - run: uv sync --locked --extra openai --extra pdf --extra tabular --python 3.11
      - run: uv run --no-config --no-project --default-index https://pypi.org/simple --script scripts/validate_golden_manifest.py
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.11"
          enable-cache: true
      - run: uv sync --locked --extra openai --extra pdf --extra tabular --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest tests/unit tests/characterization tests/contract tests/integration tests/test_schema.py --cov=survey_scribe --cov-branch --cov-report=term-missing --cov-report=xml

  package:
    name: Build and inspect distributions
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.11"
          enable-cache: true
      - run: uv sync --locked --python 3.11
      - run: uv build
      - run: uv run twine check --strict dist/*
      - run: uv run --no-config --no-project --default-index https://pypi.org/simple --with pip==25.2 python -m pip download --dest .cache/wheelhouse --requirement tests/fixtures/package/constraints.txt
      - run: uv run pytest tests/package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: survey-scribe-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
