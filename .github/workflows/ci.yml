name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.11"
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --no-config --no-project --default-index https://pypi.org/simple --script scripts/validate_golden_manifest.py
      - run: uv run pytest tests/characterization tests/test_schema.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv build
      - run: uv run --no-config --no-project --default-index https://pypi.org/simple --with pip==25.2 python -m pip download --dest .cache/wheelhouse --requirement tests/fixtures/package/constraints.txt
      - run: uv run pytest tests/package
