rationale = "diskcache 5.6.3 is pulled by Instructor in optional provider extras. Survey Scribe does not configure DiskCache or a persistent DiskCache store; exploitation requires attacker write access to a cache directory that this application does not create or read. No fixed upstream release was available on 2026-10-13. This exact finding has temporary, maintainer-approved risk acceptance for the provider extras only; see security/optional-dependency-risk-review-2026-10-13.md."
