rationale = "accelerate 1.14.0 is transitive through Docling's optional PDF stack. Survey Scribe does not accept arbitrary model checkpoint indexes or call the vulnerable checkpoint-loading APIs; PDF inputs are documents and configured OCR artifacts are hash-validated before offline conversion. No verified fixed release was available on 2026-10-13. This exact finding has temporary, maintainer-approved risk acceptance for the PDF extra only; see security/optional-dependency-risk-review-2026-10-13.md."
