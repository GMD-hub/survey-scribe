[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "survey-scribe"
version = "0.1.0"
description = "Local-first questionnaire extraction to the Survey Variable Information Schema"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "World Bank Global Monitoring Database team"},
]
keywords = [
  "data extraction",
  "household surveys",
  "metadata",
  "pydantic",
  "questionnaires",
  "schema",
  "structured data",
  "survey harmonization",
  "survey metadata",
  "SVIS",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "pydantic>=2.11.7,<3",
]

[project.optional-dependencies]
openai = [
  "instructor>=1.10.0,<2",
  "openai>=1.99.9,<2",
  "tenacity>=9.1.2,<10",
  "tiktoken>=0.11.0,<1",
]
anthropic = [
  "anthropic>=0.64.0,<1",
  "instructor>=1.10.0,<2",
]
pdf = [
  "docling>=2.125.0,<3",
  "easyocr>=1.7.2,<2",
  "lingua-language-detector>=2.1.1,<3",
  "pymupdf>=1.26.4,<2",
]
tabular = [
  "openpyxl>=3.1.5,<4",
]

[project.urls]
Homepage = "https://github.com/GMD-hub/survey-scribe"
Documentation = "https://gmd-hub.github.io/survey-scribe/"
Repository = "https://github.com/GMD-hub/survey-scribe.git"
Issues = "https://github.com/GMD-hub/survey-scribe/issues"
Changelog = "https://github.com/GMD-hub/survey-scribe/blob/main/CHANGELOG.md"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[project.scripts]
survey-scribe = "survey_scribe.cli:main"

[dependency-groups]
dev = [
  "axe-playwright-python==0.1.8",
  "bandit==1.9.4",
  "build==1.3.0",
  "check-wheel-contents==0.6.3",
  "cyclonedx-bom==7.3.1",
  "detect-secrets==1.5.0",
  "hatchling==1.27.0",
  "loguru==0.7.3",
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "mkdocstrings[python]==0.30.0",
  "pip-audit==2.10.1",
  "playwright==1.62.0",
  "pyright==1.1.404",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.2.1",
  "pytest-socket==0.8.1",
  "linkchecker==10.6.0",
  "pyyaml==6.0.3",
  "ruff==0.12.8",
  "tomli==2.2.1",
  "twine==6.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/survey_scribe"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/survey_scribe",
  "/uv.lock",
]
exclude = ["/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
  "src",
  "tests/characterization",
  "tests/cli",
  "tests/compat",
  "tests/contract",
  "tests/architecture",
  "tests/browser",
  "tests/docs",
  "tests/integration",
  "tests/package",
  "tests/quality",
  "tests/security",
  "tests/test_schema.py",
  "tests/unit",
  "scripts/check_workflow_policy.py",
  "scripts/build_wheel_sbom.py",
  "scripts/generate_docs_reference.py",
  "scripts/evaluate_quality.py",
  "scripts/evaluate_routing.py",
  "scripts/run_security_gates.py",
  "scripts/validate_ocr_artifacts.py",
  "scripts/validate_routing_fixtures.py",
  "scripts/cg_pr_preflight.py",
  "docling_pipeline.py",
]

[tool.coverage.run]
source = ["survey_scribe"]
branch = true

[tool.coverage.report]
fail_under = 95
precision = 1
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.check-wheel-contents]
toplevel = ["survey_scribe"]
