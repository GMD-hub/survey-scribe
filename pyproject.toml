[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "survey-scribe"
version = "0.1.0"
description = "Local-first questionnaire extraction to the Survey Variable Information Schema"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  {name = "World Bank Global Monitoring Database team"},
]
dependencies = [
  "pydantic==2.11.7",
]

[project.optional-dependencies]
openai = [
  "instructor==1.10.0",
  "openai==1.99.9",
  "tenacity==9.1.2",
  "tiktoken==0.11.0",
]
anthropic = [
  "anthropic==0.64.0",
  "instructor==1.10.0",
]
pdf = [
  "docling==2.54.0",
  "easyocr==1.7.2",
  "lingua-language-detector==2.1.1",
  "pymupdf==1.26.4",
]
tabular = [
  "openpyxl==3.1.5",
]

[project.scripts]
survey-scribe = "survey_scribe.cli:main"

[dependency-groups]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "loguru==0.7.3",
  "mkdocs==1.6.1",
  "mkdocs-material==9.6.18",
  "mkdocstrings[python]==0.30.0",
  "pyright==1.1.404",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
  "tomli==2.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/survey_scribe", "schemas"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/schemas",
  "/src/survey_scribe",
  "/uv.lock",
]
exclude = ["/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "agents",
  "docling_pipeline.py",
  "extractors",
  "schemas",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
  "src",
  "tests/characterization",
  "tests/package",
  "tests/test_schema.py",
]
exclude = [
  "agents",
  "docling_pipeline.py",
  "extractors",
  "schemas",
]

[tool.coverage.run]
source = ["survey_scribe"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
